# pyproject.toml - Progressive Python linting/type-checking configuration
# See: AGENTS.md "Python 后端 (v2.0)" for context

[tool.mypy]
# Suppress missing library stubs (e.g. jsonschema, croniter)
ignore_missing_imports = true

# Strict mode is enabled via CLI flag `mypy --strict`.
# Per-file relaxations are configured below to avoid touching source files
# for type annotations (per project policy: fix bugs, not typing cosmetics).

# Relax type-arg and untyped-def checks for the core/ kernel - these are
# stable files where adding annotations is out of scope.
[[tool.mypy.overrides]]
module = "_lib.core.*"
disable_error_code = [
    "type-arg",
    "no-untyped-def",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The rule selection is EXPLICIT — it used to be "whatever ruff's defaults
# happen to be", which meant a ruff release silently changed what the gate
# means (ruff 0.16+ added I/S/UP to its defaults ⇒ 36 new findings on the
# shim layer ⇒ CI turned red on 2026-08-17 without anybody changing the code).
#
# E4/E7/E9/F = the subset this repo's comment always claimed it wanted:
# real bugs (unused imports, undefined names, ambiguous names) without
# blocking on style-only cosmetics like E501.
#
# DEFERRED (not selected here, tracked in
# .rddf/improvements/fix-lint-deferred-findings.md):
#   * I001 (25 findings) — import sorting; auto-fixing it in the
#     identity-merge shim layer risks breaking the shim contract
#     (sys.path / sys.modules must be set up BEFORE the import).
#   * S102 (8 findings)  — exec(compile(...)) IS the shim mechanism.
#   * UP035/UP006/UP007  — deprecated / non-PEP585 typing forms.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = [
    "characterization: tests that lock current behavior as a baseline, not asserting specific pass/fail",
]

