openapi: 3.0.0
info:
  title: Auth V2
  version: 2.0.0
paths:
  /v2/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
