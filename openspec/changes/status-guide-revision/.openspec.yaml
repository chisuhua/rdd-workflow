schema: spec-driven
created: 2026-07-15
name: status-guide-revision
status: PROPOSED
scope: [shared]
goal: Resolve 15 audit findings in skills/guide.md and skills/status.md identified during a real execution session on 2026-07-15. Tier the fixes P0 (correctness) to P1 (usability) to P2 (consistency). Gate every change with a failing bats test that goes green after the documentation edit.
