name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt -q

      - name: Ruff lint check
        run: ruff check skills/_lib/

      - name: Mypy strict type check (core/)
        run: mypy --strict skills/_lib/core/

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats

      - name: Assertion quality gate
        run: |
          result=$(grep -rn "assert.*or True\|assert True" tests/ || true)
          if [ -n "$result" ]; then echo "❌ Tautologies:"; echo "$result"; exit 1; fi
          echo "✅ No tautological assertions"

      - name: Test isolation gate (anti-pollution)
        run: |
          bash tests/scripts/check_test_isolation.sh
          echo "✅ No test isolation violations"

      - name: Arch quality gate (strict mode)
        env:
          STRICT_ARCH_GATE: 'yes'
        run: |
          python3 -m pytest tests/unit/test_arch_quality_gate.py -q --tb=short
          echo "✅ Arch quality gate tests passed under STRICT mode"

      - name: Change alignment gate (strict mode)
        env:
          STRICT_CHANGE_GATE: 'yes'
        run: |
          python3 -m pytest tests/unit/test_change_alignment.py -q --tb=short
          echo "✅ Change alignment gate tests passed under STRICT mode"

      - name: Spec validation gate (baseline + delta targets)
        run: |
          VALIDATION_FAILED=0
          for d in openspec/changes/*/; do
            [ -d "$d" ] || continue
            case "$d" in */archive/) continue ;; esac
            name=$(basename "$d")
            echo "=== Validating $name ==="
            python3 skills/propose/scripts/validate_baseline.py "$name" || VALIDATION_FAILED=1
            python3 skills/_lib/validate_delta_targets.py "$name" || VALIDATION_FAILED=1
          done
          if [ "${VALIDATION_FAILED:-0}" -ne 0 ]; then
            echo "❌ Spec validation failed (see errors above)"
            exit 1
          fi
          echo "✅ All active changes pass spec validation"

      - name: Python unit tests
        run: python3 -m pytest tests/unit/ -q --tb=short

      - name: Python integration tests
        run: python3 -m pytest tests/integration/ -q --tb=short

      - name: Bats smoke (full recursive — v2.0.3)
        run: bats tests/ --recursive

      - name: Incremental Bats regression gate
        run: bash tests/scripts/report_regression.sh
