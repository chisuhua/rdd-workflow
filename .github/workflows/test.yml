name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt -q

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats

      - name: Assertion quality gate
        run: |
          result=$(grep -rn "assert.*or True\|assert True" tests/ || true)
          if [ -n "$result" ]; then echo "❌ Tautologies:"; echo "$result"; exit 1; fi
          echo "✅ No tautological assertions"

      - name: Arch quality gate (strict mode)
        env:
          STRICT_ARCH_GATE: 'yes'
        run: |
          python3 -m pytest tests/unit/test_arch_quality_gate.py -q --tb=short
          echo "✅ Arch quality gate tests passed under STRICT mode"

      - name: Change alignment gate (strict mode)
        env:
          STRICT_CHANGE_GATE: 'yes'
        run: |
          python3 -m pytest tests/unit/test_change_alignment.py -q --tb=short
          echo "✅ Change alignment gate tests passed under STRICT mode"

      - name: Python unit tests
        run: python3 -m pytest tests/unit/ -q --tb=short

      - name: Python integration tests
        run: python3 -m pytest tests/integration/ -q --tb=short

      - name: Bats smoke (full recursive — v2.0.3)
        run: bats tests/ --recursive

      - name: Bats integration tests (static)
        run: |
          bats tests/integration/test_skill_metadata_consistency.bats \
               tests/integration/test_version_semantics.bats \
               tests/integration/test_usage_freshness.bats \
               tests/integration/test_ai_disclaimer.bats \
               tests/integration/test_phase_numbering.bats \
               tests/integration/test_ship_done_semantics.bats \
               tests/integration/test_cleanup_safety.bats \
               tests/integration/test_doc_phase_consistency.bats \
               tests/integration/test_gate_report.bats \
               tests/integration/test_json_safety.bats \
               tests/integration/test_suggestions_format.bats \
               tests/integration/test_roadmap_templates.bats \
               tests/integration/test_build_dir_detection.bats \
               tests/integration/test_wt_var.bats \
               tests/integration/test_menu_case.bats \
               tests/integration/test_handoff.bats \
               tests/integration/test_deps_output.bats \
               tests/integration/test_deps_candidate_check.bats \
               tests/integration/test_arch_discovery_contract.bats \
               tests/integration/test_doc_contracts.bats \
               tests/integration/test_adr_index.bats \
               tests/integration/test_rddf_cli.bats \
               tests/_lib/test_scan_state.bats \
               tests/_lib/test_archive.bats

      - name: Bats integration tests (git worktree)
        run: |
          bats tests/integration/test_branch_delete.bats \
               tests/integration/test_find_default_branch_in_worktree.bats \
               tests/integration/test_merge_verification.bats \
               tests/integration/test_execute_main_root.bats \
               tests/integration/test_execute_wt_fix.bats