name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the two shrink-only gates below compare the current
      # baseline files against git history (`HEAD~1:`, `origin/master:`). With
      # the default depth=1 checkout, origin/master points at the pushed commit
      # itself (a self-comparison that can never fail) and HEAD~1 does not
      # exist at all on pull_request merge refs (empty baseline ⇒ every line
      # counts as "new" ⇒ the gate fails on every PR).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt -q

      - name: Ruff lint check (skills/_lib shims, E4/E7/E9/F)
        run: python3 -m ruff check skills/_lib/

      - name: Mypy strict type check (skills/_lib/core/ shim layer)
        run: python3 -m mypy --strict skills/_lib/core/

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
          # The regression gate needs bats >= 1.5.0 (BATS_TEST_TIMEOUT, used to
          # attribute a stuck test by name instead of discarding the file).
          bats --version

      # There is no standalone "Assertion quality gate" step any more: its grep
      # ("assert.*or True\|assert True") matched its own pattern text inside
      # tests/scripts/check_test_isolation.sh, so it could never pass. The same
      # check now lives only in that script's check #4, which excludes itself —
      # and the script is what the local gate (./test.sh --gates) also runs.
      # Unit tests exercise `create_skeleton_change`, which shells out to the
      # openspec CLI. Without it the tests crash with FileNotFoundError — the
      # CLI is a test-suite prerequisite, not an app dependency (it is not in
      # requirements.txt), so it is installed here, pinned to the version the
      # suite was written against.
      - name: Install openspec CLI (unit-test prerequisite)
        run: |
          npm install -g @fission-ai/openspec@1.14.3
          openspec --version

      # Several unit tests build throwaway git repos and `git commit` in them.
      # They inherit the machine's global identity, which a fresh runner does
      # not have (`git commit` exits 128 without it).
      - name: Configure git identity (temp-repo fixtures commit)
        run: |
          git config --global user.email "ci@rdd-workflow.invalid"
          git config --global user.name "rdd-workflow CI"

      # The bats suites call `rddf` directly (373 files). Locally it is on PATH
      # because install.sh --global symlinks it into ~/.local/bin; a runner has
      # no global install. `skills/cli/rddf.sh` is self-anchoring (it derives
      # PACKAGE_DIR from its own path and exports PYTHONPATH), so putting that
      # directory on PATH is enough — no install step needed.
      # Parity with a dev machine: install.sh --global writes a site-packages
      # `.pth` that puts the repo root on every interpreter's sys.path, so
      # `python3 -m skills.x` / `-m _lib.x` work from any cwd. A runner has no
      # such .pth ⇒ every bats fixture that shells out from a temp repo fails
      # with ModuleNotFoundError. One job-wide PYTHONPATH replaces the .pth.
      - name: Make repo importable for subprocesses (parity with install.sh .pth)
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Put repo CLI on PATH (bats suites call rddf)
        run: |
          echo "${GITHUB_WORKSPACE}/skills/cli" >> "$GITHUB_PATH"
          command -v rddf || true

      - name: Test isolation gate (anti-pollution)
        run: |
          bash tests/scripts/check_test_isolation.sh
          echo "✅ No test isolation violations"

      - name: Arch quality gate (strict mode)
        env:
          STRICT_ARCH_GATE: 'yes'
        run: |
          python3 -m pytest tests/unit/test_arch_quality_gate.py -q --tb=short
          echo "✅ Arch quality gate tests passed under STRICT mode"

      - name: Change alignment gate (strict mode)
        env:
          STRICT_CHANGE_GATE: 'yes'
        run: |
          python3 -m pytest tests/unit/test_change_alignment.py -q --tb=short
          echo "✅ Change alignment gate tests passed under STRICT mode"

      - name: Spec validation gate (baseline + delta targets)
        run: |
          VALIDATION_FAILED=0
          for d in openspec/changes/*/; do
            [ -d "$d" ] || continue
            case "$d" in */archive/) continue ;; esac
            name=$(basename "$d")
            echo "=== Validating $name ==="
            python3 skills/propose/scripts/validate_baseline.py "$name" || VALIDATION_FAILED=1
            python3 skills/_lib/validate_delta_targets.py "$name" || VALIDATION_FAILED=1
          done
          if [ "${VALIDATION_FAILED:-0}" -ne 0 ]; then
            echo "❌ Spec validation failed (see errors above)"
            exit 1
          fi
          echo "✅ All active changes pass spec validation"

      - name: Python unit tests
        run: python3 -m pytest tests/unit/ -q --tb=short

      - name: Python integration tests
        run: python3 -m pytest tests/integration/ -q --tb=short

      # The category list lives in doctor_main.py (_GATES) — the local gate
      # (./test.sh --gates) calls the same command, so the two cannot drift.
      # Semantics unchanged: a category with CRITICAL findings (exit >= 2)
      # fails the gate; warnings do not.
      - name: rdd-doctor structural gate (10 categories, fail-on-CRITICAL)
        run: bash skills/rdd-doctor/scripts/doctor.sh --gate structural

      - name: rdd-doctor advisory gate (4 categories, non-blocking)
        run: bash skills/rdd-doctor/scripts/doctor.sh --gate advisory

      # `tests/integration/**` is covered by the baseline-aware regression gate
      # below: KNOWN_FAILURES.txt carries 11 ACCEPTED failures, so a raw
      # `bats tests/ --recursive` reports them as errors on every run and can
      # never be green — that is exactly what the baseline gate exists for.
      # Everything outside integration/ has no baseline by design ⇒ runs raw.
      - name: Bats smoke (non-integration scope; integration runs under the baseline gate)
        run: |
          mapfile -t files < <(find tests -name '*.bats' \
            -not -path 'tests/integration/*' -not -path 'tests/e2e/*' | sort)
          echo "running ${#files[@]} non-integration bats files"
          bats "${files[@]}"

      - name: A-layer e2e smoke (CI必跑 — per 2026-09-08-e2e-test-plan-design.md §3.2)
        run: |
          ./test.sh --e2e-smoke
          echo "✅ A-layer e2e smoke passed"

      - name: Incremental Bats regression gate
        # Thresholds are stated here (not left implicit) so the CI mouth is
        # auditable. Level 1 = per-file timeout; level 2 = per-test timeout
        # (BATS_TIMEOUT_RETRY); BATS_RETRY_BUDGET caps the total retry time.
        env:
          BATS_TIMEOUT: '30'
          BATS_TIMEOUT_RETRY: '120'
          BATS_RETRY_BUDGET: '600'
        run: bash tests/scripts/report_regression.sh

      # Baseline resolution order matters: on a push to master the pushed
      # commit IS origin/master, so comparing against it would be a
      # self-comparison that can never fail. HEAD~1 is the previous tip (push
      # to master) or the base branch tip (pull_request merge ref) — take it
      # first and keep origin/master as the fallback (e.g. shallow-ish clones).
      - name: KNOWN_UNEVALUATED.txt shrink-only enforcement
        run: |
          set -e
          BASELINE=$(git show HEAD~1:tests/KNOWN_UNEVALUATED.txt 2>/dev/null || git show origin/master:tests/KNOWN_UNEVALUATED.txt || true)
          CURRENT=$(cat tests/KNOWN_UNEVALUATED.txt)
          NEW_LINES=$(comm -13 <(printf '%s\n' "$BASELINE" | sed '/^[[:space:]]*$/d' | sort -u) \
                          <(printf '%s\n' "$CURRENT" | sed '/^[[:space:]]*$/d' | sort -u) || true)
          if [ -n "$NEW_LINES" ]; then
            echo "❌ KNOWN_UNEVALUATED.txt grew (CI forbidden):"
            echo "$NEW_LINES"
            exit 1
          fi
          echo "✅ KNOWN_UNEVALUATED.txt did not grow"

      - name: Regression-gate bypass must not be set in CI
        run: |
          if [ -n "${SKIP_UNEVALUATED_GATE:-}" ]; then
            echo "::error title=regression-gate::SKIP_UNEVALUATED_GATE is set in CI — the unevaluated gate is permanently bypassed"
            exit 1
          fi
          echo "✅ no regression-gate bypass"

      - name: KNOWN_FAILURES.txt shrink-only enforcement
        run: |
          set -e
          BASELINE=$(git show HEAD~1:tests/KNOWN_FAILURES.txt 2>/dev/null || git show origin/master:tests/KNOWN_FAILURES.txt)
          # Reuse report_regression.sh L27-34 sed strip rules
          BASELINE_STRIPPED=$(echo "$BASELINE" | sed -E 's/[[:space:]]+# (pre-existing|historical)[^[:alnum:]].*$//' | sed '/^[[:space:]]*$/d' | sort -u)
          CURRENT_STRIPPED=$(sed -E 's/[[:space:]]+# (pre-existing|historical)[^[:alnum:]].*$//' tests/KNOWN_FAILURES.txt | sed '/^[[:space:]]*$/d' | sort -u)
          NEW_LINES=$(comm -13 <(echo "$BASELINE_STRIPPED") <(echo "$CURRENT_STRIPPED") || true)
          if [ -n "$NEW_LINES" ]; then
            echo "❌ KNOWN_FAILURES.txt grew (CI forbidden):"
            echo "$NEW_LINES"
            exit 1
          fi
          echo "✅ KNOWN_FAILURES.txt did not grow"
