name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt -q

      - name: Ruff lint check
        run: ruff check skills/_lib/

      - name: Mypy strict type check (core/)
        run: mypy --strict skills/_lib/core/

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats

      - name: Assertion quality gate
        run: |
          result=$(grep -rn "assert.*or True\|assert True" tests/ || true)
          if [ -n "$result" ]; then echo "❌ Tautologies:"; echo "$result"; exit 1; fi
          echo "✅ No tautological assertions"

      - name: Test isolation gate (anti-pollution)
        run: |
          bash tests/scripts/check_test_isolation.sh
          echo "✅ No test isolation violations"

      - name: Arch quality gate (strict mode)
        env:
          STRICT_ARCH_GATE: 'yes'
        run: |
          python3 -m pytest tests/unit/test_arch_quality_gate.py -q --tb=short
          echo "✅ Arch quality gate tests passed under STRICT mode"

      - name: Change alignment gate (strict mode)
        env:
          STRICT_CHANGE_GATE: 'yes'
        run: |
          python3 -m pytest tests/unit/test_change_alignment.py -q --tb=short
          echo "✅ Change alignment gate tests passed under STRICT mode"

      - name: Spec validation gate (baseline + delta targets)
        run: |
          VALIDATION_FAILED=0
          for d in openspec/changes/*/; do
            [ -d "$d" ] || continue
            case "$d" in */archive/) continue ;; esac
            name=$(basename "$d")
            echo "=== Validating $name ==="
            python3 skills/propose/scripts/validate_baseline.py "$name" || VALIDATION_FAILED=1
            python3 skills/_lib/validate_delta_targets.py "$name" || VALIDATION_FAILED=1
          done
          if [ "${VALIDATION_FAILED:-0}" -ne 0 ]; then
            echo "❌ Spec validation failed (see errors above)"
            exit 1
          fi
          echo "✅ All active changes pass spec validation"

      - name: Python unit tests
        run: python3 -m pytest tests/unit/ -q --tb=short

      - name: Python integration tests
        run: python3 -m pytest tests/integration/ -q --tb=short

      - name: rdd-doctor structural gate (10 categories, fail-on-CRITICAL)
        run: |
          set +e
          STRUCTURAL=(state plan-tdd roadmap-meta roadmap-refs roadmap-feature roadmap-md-integrity roadmap-phases objective-lifecycle objective-structure arch-audit)
          FAILED=0
          for cat in "${STRUCTURAL[@]}"; do
            bash skills/rdd-doctor/scripts/doctor.sh --category "$cat" --quiet
            rc=$?
            if [ $rc -ge 2 ]; then
              echo "::error title=rdd-doctor::${cat} CRITICAL (exit $rc)"
              FAILED=$((FAILED+1))
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "❌ rdd-doctor structural gate: $FAILED category failures"
            exit 1
          fi
          echo "✅ rdd-doctor structural gate: all 10 categories pass"

      - name: rdd-doctor advisory gate (4 categories, non-blocking)
        run: |
          set +e
          ADVISORY=(bypass-audit migration-residue review-debt roadmap-backup)
          for cat in "${ADVISORY[@]}"; do
            bash skills/rdd-doctor/scripts/doctor.sh --category "$cat" --quiet
            rc=$?
            if [ $rc -ge 1 ]; then
              echo "::warning title=rdd-doctor::${cat} advisory (exit $rc)"
            fi
          done
          echo "✅ rdd-doctor advisory gate: warnings logged (non-blocking)"

      - name: Bats smoke (full recursive — v2.0.3)
        run: bats tests/ --recursive

      - name: A-layer e2e smoke (CI必跑 — per 2026-09-08-e2e-test-plan-design.md §3.2)
        run: |
          ./test.sh --e2e-smoke
          echo "✅ A-layer e2e smoke passed"

      - name: Incremental Bats regression gate
        run: bash tests/scripts/report_regression.sh

      - name: KNOWN_FAILURES.txt shrink-only enforcement
        run: |
          set -e
          BASELINE=$(git show origin/master:tests/KNOWN_FAILURES.txt 2>/dev/null || git show HEAD~1:tests/KNOWN_FAILURES.txt)
          # Reuse report_regression.sh L27-34 sed strip rules
          BASELINE_STRIPPED=$(echo "$BASELINE" | sed -E 's/[[:space:]]+# (pre-existing|historical)[^[:alnum:]].*$//' | sed '/^[[:space:]]*$/d' | sort -u)
          CURRENT_STRIPPED=$(sed -E 's/[[:space:]]+# (pre-existing|historical)[^[:alnum:]].*$//' tests/KNOWN_FAILURES.txt | sed '/^[[:space:]]*$/d' | sort -u)
          NEW_LINES=$(comm -13 <(echo "$BASELINE_STRIPPED") <(echo "$CURRENT_STRIPPED") || true)
          if [ -n "$NEW_LINES" ]; then
            echo "❌ KNOWN_FAILURES.txt grew (CI forbidden):"
            echo "$NEW_LINES"
            exit 1
          fi
          echo "✅ KNOWN_FAILURES.txt did not grow"
